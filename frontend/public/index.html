<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Event Management</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        nav { background: #4f46e5; padding: 15px; color: white; display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav><h2>🎉 CampusEvents</h2><div id="user-info">Login to Register</div></nav>
    <main>
        <h1>Available University Events</h1>
        <div class="grid" id="events-box">Loading campus events...</div>
    </main>
    <script>
        async function fetchEvents() {
            try {
                const res = await fetch('http://localhost:5000/api/events');
                const data = await res.json();
                const box = document.getElementById('events-box');
                if(data.length === 0) { box.innerHTML = '<p>No scheduled events found.</p>'; return; }
                box.innerHTML = data.map(e => `<div class="card"><h3>${e.title}</h3><p>${e.description}</p><small>📍 ${e.location}</small></div>`).join('');
            } catch { document.getElementById('events-box').innerHTML = '<p>Backend server offline.</p>'; }
        }
        window.onload = fetchEvents;
    </script>
</body>
</html>
